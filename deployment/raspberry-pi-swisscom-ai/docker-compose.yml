services:
  changedetection:
    image: ghcr.io/dgtlmoon/changedetection.io:latest
    container_name: changedetection
    restart: unless-stopped
    ports:
      - "5000:5000"
    volumes:
      - ./datastore:/datastore
    environment:
      - TZ=Europe/Zurich
      - LOGGER_LEVEL=INFO
      - ALLOW_IANA_RESTRICTED_ADDRESSES=true
      - PLAYWRIGHT_DRIVER_URL=ws://browser-sockpuppet-chrome:3000
    depends_on:
      - swisscom-ai
      - browser-sockpuppet-chrome
    networks:
      - changedetection_net

  browser-sockpuppet-chrome:
    image: dgtlmoon/sockpuppetbrowser:latest
    container_name: browser-sockpuppet-chrome
    hostname: browser-sockpuppet-chrome
    restart: unless-stopped
    cap_add:
      - SYS_ADMIN
    environment:
      - SCREEN_WIDTH=1920
      - SCREEN_HEIGHT=1080
      - SCREEN_DEPTH=16
      - MAX_CONCURRENT_CHROME_PROCESSES=2
    networks:
      - changedetection_net

  swisscom-ai:
    build: ./swisscom-ai-proxy
    container_name: swisscom-ai
    restart: unless-stopped
    env_file:
      - .env
    expose:
      - "8080"
    networks:
      - changedetection_net

networks:
  changedetection_net:
    driver: bridge
